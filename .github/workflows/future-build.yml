name: future-build

on:
  push:
    branches:
      - future
  pull_request:
    branches:
      - future
  workflow_dispatch:

# 同一 ref 上只保留最新一次构建，旧构建被取消，避免它最后覆盖新镜像
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  FUTURE_REPO: https://github.com/zhizhishu/octopus

jobs:
  validate:
    name: Validate future branch
    runs-on: ubuntu-latest
    outputs:
      upstream_version: ${{ steps.upstream_version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve version
        id: upstream_version
        shell: bash
        run: |
          set -euo pipefail
          # 版本号由本项目自己的提交决定，**不再查询任何外部仓库**。
          #
          # 原实现会去问上游作者的 release 接口拿版本号，把自己的构建命名成别人的
          # 版本。这既让"我们发布的是哪个版本"说不清楚，也让每次构建都依赖一个
          # 与我们无关的仓库是否可访问。本项目已独立演进，版本自己定。
          #
          # 保留 `upstream_version` 这个 step id 只是为了让后面引用它的地方不用改；
          # 它现在的含义就是"本项目版本"。
          version="future-${GITHUB_SHA::7}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building version: $version"

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Run frontend regressions
        working-directory: web
        run: pnpm test

      - name: Build frontend
        working-directory: web
        run: |
          NEXT_PUBLIC_APP_VERSION="${{ steps.upstream_version.outputs.version }}" \
          NEXT_PUBLIC_GITHUB_REPO="${FUTURE_REPO}" \
          pnpm run build

      - name: Embed frontend output
        run: |
          rm -rf static/out
          mv web/out static/out

      - name: Run Go tests
        run: go test -count=1 ./...

      - name: Build binary
        run: |
          mkdir -p build
          go build \
            -ldflags="-X 'github.com/zhizhishu/octopus/internal/conf.Version=${{ steps.upstream_version.outputs.version }}' -X 'github.com/zhizhishu/octopus/internal/conf.Author=zhizhishu' -X 'github.com/zhizhishu/octopus/internal/conf.Commit=${GITHUB_SHA::7}' -X 'github.com/zhizhishu/octopus/internal/conf.Repo=${FUTURE_REPO}'" \
            -o build/octopus-future .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: octopus-future-linux-amd64
          path: build/octopus-future

  image:
    name: Build and push future images
    needs: validate
    # 只在 future 分支上发布镜像；PR 与非 future 的手动触发都不写注册表
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/future'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build release artifacts
        run: |
          GIT_VERSION="${{ needs.validate.outputs.upstream_version }}" \
          GIT_AUTHOR="zhizhishu" \
          GIT_REPO="${FUTURE_REPO}" \
          bash scripts/build.sh release

      - name: Docker meta (Debian)
        id: meta-debian
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          # 共享标签由 Promote 按 digest 发布；这里只推 per-commit 的 sha 标签（re-run 可覆盖）
          tags: |
            type=sha,prefix=future-

      - name: Docker meta (Alpine)
        id: meta-alpine
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=future-alpine-

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (Alpine)
        id: build-alpine
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./scripts/dockerfiles/Dockerfile.alpine
          push: true
          platforms: linux/amd64,linux/386,linux/arm64,linux/arm/v7
          tags: ${{ steps.meta-alpine.outputs.tags }}
          labels: ${{ steps.meta-alpine.outputs.labels }}
          build-args: |
            TARGETPLATFORM

      - name: Build and push (Debian)
        id: build-debian
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./scripts/dockerfiles/Dockerfile.debian
          push: true
          platforms: linux/amd64,linux/386,linux/arm64,linux/arm/v7
          tags: ${{ steps.meta-debian.outputs.tags }}
          labels: ${{ steps.meta-debian.outputs.labels }}
          build-args: |
            TARGETPLATFORM

      # 取消与 head 守卫都不是注册表事务：OCI 没有 tag 级 compare-and-swap。
      - name: Promote shared tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          head_sha() {
            local sha
            sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/future" --jq .sha)" || return 1
            if [ -z "${sha}" ]; then
              echo "::error::cannot resolve future head" >&2
              return 1
            fi
            printf '%s\n' "${sha}"
          }

          require_digest() {
            if [[ ! "$1" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::unexpected digest '$1'"
              exit 1
            fi
          }

          publish() {
            local expected="$1"
            shift
            local args=() tag observed
            for tag in "$@"; do
              args+=(--tag "${IMAGE_NAME}:${tag}")
            done
            docker buildx imagetools create "${args[@]}" "${IMAGE_NAME}@${expected}"
            for tag in "$@"; do
              observed="$(docker buildx imagetools inspect "${IMAGE_NAME}:${tag}" --format '{{.Manifest.Digest}}')"
              if [ "${observed}" != "${expected}" ]; then
                echo "::error::${IMAGE_NAME}:${tag} is '${observed}', expected '${expected}'"
                return 1
              fi
            done
          }

          debian_digest='${{ steps.build-debian.outputs.digest }}'
          alpine_digest='${{ steps.build-alpine.outputs.digest }}'
          require_digest "${debian_digest}"
          require_digest "${alpine_digest}"

          # head 读取紧贴在每次 publish 之前；查询或发布失败都是失败，不会被当成“已过期”。
          head="$(head_sha)"
          if [ "${head}" != "${GITHUB_SHA}" ]; then
            echo "::notice::future head is ${head}; skipping shared tags for ${GITHUB_SHA}"
            exit 0
          fi
          publish "${debian_digest}" future future-debian

          head="$(head_sha)"
          if [ "${head}" != "${GITHUB_SHA}" ]; then
            echo "::notice::future head is ${head}; skipping shared tags for ${GITHUB_SHA}"
            exit 0
          fi
          publish "${alpine_digest}" future-alpine
