name: future-build

on:
  push:
    branches:
      - future
  pull_request:
    branches:
      - future
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  FUTURE_REPO: https://github.com/zhizhishu/octopus

jobs:
  validate:
    name: Validate future branch
    runs-on: ubuntu-latest
    outputs:
      upstream_version: ${{ steps.upstream_version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve version
        id: upstream_version
        shell: bash
        run: |
          set -euo pipefail
          # 版本号由本项目自己的提交决定，**不再查询任何外部仓库**。
          #
          # 原实现会去问上游作者的 release 接口拿版本号，把自己的构建命名成别人的
          # 版本。这既让"我们发布的是哪个版本"说不清楚，也让每次构建都依赖一个
          # 与我们无关的仓库是否可访问。本项目已独立演进，版本自己定。
          #
          # 保留 `upstream_version` 这个 step id 只是为了让后面引用它的地方不用改；
          # 它现在的含义就是"本项目版本"。
          version="future-${GITHUB_SHA::7}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building version: $version"

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Run frontend regressions
        working-directory: web
        run: pnpm test

      - name: Build frontend
        working-directory: web
        run: |
          NEXT_PUBLIC_APP_VERSION="${{ steps.upstream_version.outputs.version }}" \
          NEXT_PUBLIC_GITHUB_REPO="${FUTURE_REPO}" \
          pnpm run build

      - name: Embed frontend output
        run: |
          rm -rf static/out
          mv web/out static/out

      - name: Run Go tests
        run: go test ./...

      - name: Build binary
        run: |
          mkdir -p build
          go build \
            -ldflags="-X 'github.com/zhizhishu/octopus/internal/conf.Version=${{ steps.upstream_version.outputs.version }}' -X 'github.com/zhizhishu/octopus/internal/conf.Author=zhizhishu' -X 'github.com/zhizhishu/octopus/internal/conf.Commit=${GITHUB_SHA::7}' -X 'github.com/zhizhishu/octopus/internal/conf.Repo=${FUTURE_REPO}'" \
            -o build/octopus-future .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: octopus-future-linux-amd64
          path: build/octopus-future

  image:
    name: Build and push future images
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build release artifacts
        run: |
          GIT_VERSION="${{ needs.validate.outputs.upstream_version }}" \
          GIT_AUTHOR="zhizhishu" \
          GIT_REPO="${FUTURE_REPO}" \
          bash scripts/build.sh release

      - name: Docker meta (Debian)
        id: meta-debian
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=future
            type=raw,value=future-debian
            type=sha,prefix=future-

      - name: Docker meta (Alpine)
        id: meta-alpine
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=future-alpine
            type=sha,prefix=future-alpine-

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (Alpine)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./scripts/dockerfiles/Dockerfile.alpine
          push: true
          platforms: linux/amd64,linux/386,linux/arm64,linux/arm/v7
          tags: ${{ steps.meta-alpine.outputs.tags }}
          labels: ${{ steps.meta-alpine.outputs.labels }}
          build-args: |
            TARGETPLATFORM

      - name: Build and push (Debian)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./scripts/dockerfiles/Dockerfile.debian
          push: true
          platforms: linux/amd64,linux/386,linux/arm64,linux/arm/v7
          tags: ${{ steps.meta-debian.outputs.tags }}
          labels: ${{ steps.meta-debian.outputs.labels }}
          build-args: |
            TARGETPLATFORM
